<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Shenu!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #fed6e3 0%, #a8c1ef 100%);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('birthday-bg.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; 
            z-index: 1;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
        }
        .bg-layer.visible { opacity: 1; }
        
        .container {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 90%;
            max-width: 500px;
            min-height: 300px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .gift-btn {
            background-color: #ff477e;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4);
            transition: transform 0.2s;
        }
        .hidden { display: none !important; }
        
        .svg-sticker-container { width: 100%; filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.2)); }
        .svg-sticker-text { font-family: 'Pacifico', cursive; font-size: 68px; user-select: none; }
        
        p { font-family: 'Quicksand', sans-serif; font-size: 1.3rem; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); margin-top: 10px; }
    </style>
</head>
<body>

    <div id="bg-photo" class="bg-layer"></div>
    <audio id="birthday-song" src="birthday-song.mp3" preload="auto"></audio>

    <div id="main-container" class="container">
        <button id="click-me-btn" class="gift-btn">Click Here</button>
        
        <div id="message-container" class="glass-card hidden">
            <div class="svg-sticker-container">
                <svg viewBox="0 0 600 250" width="100%" height="100%">
                    <defs><linearGradient id="pinkGradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffb5d2" /><stop offset="100%" stop-color="#cc1b53" /></linearGradient></defs>
                    <g text-anchor="middle" class="svg-sticker-text">
                        <text x="50%" y="90" fill="#6A3970" stroke="#6A3970" stroke-width="26" stroke-linejoin="round">Happy Birthday</text>
                        <text x="50%" y="185" fill="#6A3970" stroke="#6A3970" stroke-width="26" stroke-linejoin="round">Shenu!</text>
                        <text x="50%" y="90" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round">Happy Birthday</text>
                        <text x="50%" y="185" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round">Shenu!</text>
                        <text x="50%" y="90" fill="url(#pinkGradient)">Happy Birthday</text>
                        <text x="50%" y="185" fill="url(#pinkGradient)">Shenu!</text>
                    </g>
                </svg>
            </div>
            <p>Wishing you a wonderful day filled with joy and happiness!</p>
        </div>
    </div>

    <script>
        // Custom palette
        const myConfettiColors = ['#F27FA9', '#C48FE2', '#76C2EC', '#FFF0A5'];

        document.getElementById('click-me-btn').addEventListener('click', function() {
            this.classList.add('hidden');
            document.getElementById('message-container').classList.remove('hidden');
            document.getElementById('bg-photo').classList.add('visible');
            
            const song = document.getElementById('birthday-song');
            song.play().catch(e => console.log("Playback prevented:", e));
            
            // Helper to pick a random color
            const randomColor = () => myConfettiColors[Math.floor(Math.random() * myConfettiColors.length)];

            // 1. Initial bursts
            confetti({ 
                particleCount: 300, 
                origin: { x: 0, y: 1 }, 
                colors: myConfettiColors 
            });
            confetti({ 
                particleCount: 300, 
                origin: { x: 1, y: 1 }, 
                colors: myConfettiColors 
            });

            // 2. Continuous rain loop
            const rainConfetti = () => {
                confetti({
                    particleCount: 2,
                    angle: 270,
                    spread: 10,
                    startVelocity: 1,
                    origin: { x: Math.random(), y: 0 },
                    gravity: 0.4,
                    ticks: 600,
                    scalar: 0.8,
                    colors: [randomColor()] // Forced individual selection for variety
                });
                requestAnimationFrame(rainConfetti);
            };
            rainConfetti();
        });
    </script>
</body>
</html>
