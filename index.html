<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Shenu!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #fed6e3 0%, #a8c1ef 100%);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        
        .preload-img { display: none; }
        
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('birthday-bg.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; 
            z-index: 1;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
        }
        .bg-layer.visible { opacity: 1; }
        
        .container {
            padding: 20px;
            z-index: 10;
            transition: all 0.4s ease;
            width: 92%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        /* Ultra-Transparent Frosted Glass */
        .glass-card {
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .gift-btn {
            background-color: #ff477e;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4);
            transition: transform 0.2s;
            margin: 0 auto;
        }
        .hidden { display: none !important; }
        .birthday-message { animation: fadeIn 1.2s ease-in-out forwards; }
        
        .svg-sticker-container { width: 100%; filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.2)); }
        .svg-sticker-text { font-family: 'Pacifico', cursive; font-size: 68px; user-select: none; }
        
        /* Readability fix: adding a text-shadow so white text pops on any photo */
        p { 
            font-family: 'Quicksand', sans-serif; 
            font-size: 1.4rem; 
            font-weight: 700; 
            color: #fff; 
            margin-top: -10px; 
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); 
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <img src="birthday-bg.png" class="preload-img">
    
    <div id="bg-photo" class="bg-layer"></div>
    <audio id="birthday-song" src="birthday-song.mp3" preload="auto"></audio>

    <div id="main-container" class="container">
        <button id="click-me-btn" class="gift-btn">Click Here</button>
        
        <div id="message-container" class="birthday-message hidden">
            <div class="svg-sticker-container">
                <svg viewBox="0 0 600 250" width="100%" height="100%">
                    <defs><linearGradient id="pinkGradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffb5d2" /><stop offset="100%" stop-color="#cc1b53" /></linearGradient></defs>
                    <g text-anchor="middle" class="svg-sticker-text">
                        <text x="50%" y="90" fill="#6A3970" stroke="#6A3970" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">Happy Birthday</text>
                        <text x="50%" y="185" fill="#6A3970" stroke="#6A3970" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">Shenu!</text>
                        <text x="50%" y="90" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">Happy Birthday</text>
                        <text x="50%" y="185" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">Shenu!</text>
                        <text x="50%" y="90" fill="url(#pinkGradient)">Happy Birthday</text>
                        <text x="50%" y="185" fill="url(#pinkGradient)">Shenu!</text>
                    </g>
                </svg>
            </div>
            <p>Wishing you a wonderful day filled with joy and happiness!</p>
        </div>
    </div>

    <script>
        document.getElementById('click-me-btn').addEventListener('click', function() {
            this.classList.add('hidden');
            document.getElementById('message-container').classList.remove('hidden');
            document.getElementById('bg-photo').classList.add('visible');
            document.getElementById('main-container').classList.add('glass-card');
            document.getElementById('birthday-song').play();
            
            confetti({ particleCount: 180, angle: 65, spread: 65, startVelocity: 55, origin: { x: 0, y: 1.0 } });
            confetti({ particleCount: 180, angle: 115, spread: 65, startVelocity: 55, origin: { x: 1.0, y: 1.0 } });
        });
    </script>
</body>
</html>
